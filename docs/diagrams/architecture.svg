<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">User Proxy Agent 전체 구조</title>
<desc id="architecture-desc">React 웹에서 DeepAgents에 요청하면 로컬 FastAPI가 통화와 Google 앱 실행을 연결하며, 전화 음성은 통화 서비스를 통해 GPT-Live와 ClawOps 사이를 오가고 쓰기 작업은 사용자 승인 후 실행됩니다.</desc>
<defs>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif; fill: #262626; }
    .title { font-size: 28px; font-weight: 700; letter-spacing: -.6px; }
    .name { font-size: 24px; font-weight: 650; letter-spacing: -.4px; }
    .body { font-size: 18px; fill: #62625f; }
    .small { font-size: 16px; fill: #62625f; }
    .tag { font-size: 13px; font-weight: 600; fill: #62625f; letter-spacing: 1.4px; }
    .edge { fill: none; stroke: #858580; stroke-width: 1.5; marker-end: url(#architecture-arrow); }
    .both { marker-start: url(#architecture-arrow); }
  </style>
  <marker id="architecture-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858580" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="architecture-arrow-accent" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#25724e" stroke-width="1.3"/></marker>
  <marker id="architecture-arrow-link" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858580" stroke-width="1.3"/></marker>
</defs>
<rect width="960" height="960" fill="#f7f7f6"/>
<text x="48" y="53" class="title">User Proxy Agent</text>
<text x="912" y="51" class="tag" text-anchor="end">SYSTEM OVERVIEW</text>

<!-- Local boundary; external providers sit below it. -->
<rect x="48" y="248" width="864" height="364" rx="8" fill="#f0f0ee" stroke="#ddddd8"/>
<text x="72" y="278" class="tag">FASTAPI</text>
<text x="174" y="278" class="small">로컬 백엔드</text>

<!-- Every connector is straight and has distinct attachment points. -->
<path d="M480 196 V300" class="edge both"/>
<path d="M280 412 V484" class="edge both"/>
<path d="M768 412 V484" class="edge"/>
<path d="M176 588 V676" class="edge both"/>
<path d="M436 588 V676" class="edge both"/>
<path d="M768 588 V676" class="edge both"/>

<!-- Labels sit beside the lines, on opaque masks. -->
<rect x="496" y="212" width="112" height="28" fill="#f7f7f6"/>
<text x="504" y="232" class="small">채팅 · 응답</text>
<rect x="296" y="432" width="220" height="28" fill="#f0f0ee"/>
<text x="304" y="452" class="small">통화 도구 · 업무 판단 위임</text>
<rect x="784" y="432" width="108" height="28" fill="#f0f0ee"/>
<text x="792" y="452" class="small">조회 · 제안</text>
<rect x="64" y="628" width="100" height="28" fill="#f7f7f6"/>
<text x="72" y="648" class="small">음성 · 위임</text>
<rect x="452" y="628" width="128" height="28" fill="#f7f7f6"/>
<text x="460" y="648" class="small">음성 · 회선 제어</text>
<rect x="784" y="628" width="104" height="28" fill="#f7f7f6"/>
<text x="792" y="648" class="small">Google API</text>

<!-- Web -->
<rect x="72" y="96" width="816" height="100" rx="8" fill="#262626"/>
<text x="100" y="135" class="name" style="fill:#fff">React 웹</text>
<text x="100" y="167" class="body" style="fill:#d7d7d2">채팅 요청 · 실시간 전사 · 통화 듣기 · 추가 지시와 종료 · 실행 승인</text>
<text x="860" y="135" class="tag" text-anchor="end" style="fill:#d7d7d2">USER INTERFACE</text>

<!-- Agent: shared configuration, separate executions. -->
<rect x="72" y="300" width="816" height="112" rx="8" fill="#fff" stroke="#aaa9a2"/>
<text x="100" y="341" class="name">DeepAgents</text>
<text x="100" y="377" class="body">메인 채팅 실행 / 통화 업무 실행</text>
<line x1="508" y1="324" x2="508" y2="388" stroke="#e5e5e3"/>
<text x="536" y="340" class="small">공통 팩토리 · 같은 모델 설정</text>
<text x="536" y="377" class="body">설정한 텍스트 모델 API로 판단</text>

<!-- Two responsibilities, deliberately different widths. -->
<rect x="72" y="484" width="464" height="104" rx="8" fill="#eef5f0" stroke="#25724e"/>
<text x="100" y="525" class="name" style="fill:#205b40">통화 서비스</text>
<text x="100" y="559" class="body">음성 중계 · ARS 다이얼 · 끼어들기 · 종료</text>
<rect x="648" y="484" width="240" height="104" rx="8" fill="#fff" stroke="#aaa9a2"/>
<text x="672" y="525" class="name">앱 서비스</text>
<text x="672" y="559" class="body">조회 / 쓰기는 승인 후</text>

<!-- Providers. Phone is an explicit destination within ClawOps' card. -->
<rect x="72" y="676" width="208" height="124" rx="8" fill="#fff" stroke="#d7d7d2"/>
<text x="96" y="714" class="name">GPT-Live</text>
<text x="96" y="746" class="body">음성 이해 · 생성</text>
<text x="96" y="778" class="small">별도 STT / TTS 없음</text>
<rect x="332" y="676" width="208" height="124" rx="8" fill="#fff" stroke="#d7d7d2"/>
<text x="356" y="714" class="name">ClawOps</text>
<text x="356" y="746" class="body">전화 연결 · 회선 제어</text>
<text x="356" y="778" class="small">↔ 통화 상대 / ARS</text>
<rect x="648" y="676" width="240" height="124" rx="8" fill="#fff" stroke="#d7d7d2"/>
<text x="672" y="714" class="name">Google</text>
<text x="672" y="746" class="body">Calendar · Gmail</text>
<text x="672" y="778" class="small">OAuth 계정 연결</text>

<!-- Cross-cutting concerns, intentionally without per-node wiring. -->
<line x1="48" y1="840" x2="912" y2="840" stroke="#ddddd8"/>
<text x="72" y="877" font-size="19" font-weight="600">SQLite</text>
<text x="72" y="907" class="small">로컬 대화 · 통화 · 실행 상태 저장</text>
<line x1="508" y1="864" x2="508" y2="916" stroke="#ddddd8"/>
<text x="536" y="877" font-size="19" font-weight="600">Langfuse</text>
<text x="638" y="877" class="small">선택 사항</text>
<text x="536" y="907" class="small">실행 메타데이터 추적 · 대화 원문 제외</text>
</svg>
