[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.1.0"
description = "Chat-first personal agent service"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50,<51",
    "deepagents==0.7.19",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-openai==1.6.6",
    "langfuse>=4,<5",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
    "webrtcvad-wheels>=2.0.14,<3",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "pytest-asyncio>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["agent_service"]
known-local-folder = ["live_dialogue_cases", "live_korean_metrics"]
